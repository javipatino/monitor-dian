name: Monitor DIAN

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" para probar a mano
    inputs:
      test:
        description: "Solo mandar mensaje de prueba a Telegram"
        type: boolean
        default: false

concurrency:
  group: monitor-dian
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Recuperar estado anterior
        uses: actions/cache/restore@v4
        with:
          path: estado_dian.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Revisar DIAN
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_dian.py ${{ inputs.test && '--test' || '' }}

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado_dian.json
          key: estado-${{ github.run_id }}

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.run_id }}
          path: "*.png"
          retention-days: 2
          if-no-files-found: ignore
